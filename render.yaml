databases:
  - name: marketos-db
    databaseName: marketos
    user: marketos_admin
    plan: free

services:
  - type: web
    name: marketos
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: marketos-db
          property: connectionString
